<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hankook Telemetry</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <img src="/static/hankook-logo.svg" alt="Hankook Tire &amp; Technology" class="brand-logo">
    <div id="status" class="status disconnected">Connecting…</div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <section class="speed-row">
    <div class="speed-card">
      <div class="label">Speed</div>
      <div class="value"><span id="speed">--</span> <span class="unit">km/h</span></div>
    </div>
    <div class="speed-card">
      <div class="label">Target</div>
      <div class="value"><span id="target-speed">--</span> <span class="unit">km/h</span></div>
    </div>
  </section>

  <section class="control-row">
    <button type="button" id="btn-set-position" class="control-btn">SET POSITION</button>
    <button type="button" id="btn-ready" class="control-btn not-ready">READY</button>
  </section>
  <div id="ready-hint" class="ready-hint hidden"></div>

  <section class="driver-row">
    <span id="op-badge" class="badge off">OFF</span>
    <div id="gas" class="pill">GAS</div>
    <div id="brake" class="pill">BRAKE</div>
    <div id="left-blinker" class="pill blinker">◀</div>
    <div id="right-blinker" class="pill blinker">▶</div>
  </section>

  <section class="steering">
    <div class="label">Steering</div>
    <div class="steer-bar-wrap">
      <div id="steer-bar" class="steer-bar"></div>
    </div>
    <div id="steer-angle" class="steer-angle">0°</div>
  </section>

  <section class="gps-info">
    <div class="gps-row">
      <span class="label">GPS</span>
      <span id="gps-fix" class="gps-fix">No fix</span>
    </div>
    <div class="gps-row gps-details">
      <span class="gps-coords"><span id="lat">--</span>, <span id="lon">--</span></span>
      <span class="gps-meta">Acc <span id="accuracy">--</span> m · <span id="sats">--</span> sats</span>
    </div>
  </section>

  <section id="map"></section>

  <div id="countdown-overlay" class="countdown-overlay hidden" aria-live="assertive">
    <div class="countdown-warning">BRAKING SOON</div>
    <div id="countdown-value" class="countdown-value">5</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
